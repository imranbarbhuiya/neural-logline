name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun run check
      - name: Verify deterministic weights
        run: |
          sha256sum src/weights.ts > /tmp/weights.before
          bun run train
          sha256sum src/weights.ts > /tmp/weights.after
          diff /tmp/weights.before /tmp/weights.after
